# Μετά από κάθε συνεδρίαση της αγοράς ΗΠΑ: πλήρης ανάλυση όλης της αγοράς με τον αλγόριθμο του US Alpha
# (engine.tgz) και δημοσίευση της εφαρμογής + αποτελεσμάτων στο GitHub Pages. Χωρίς API keys.
# Τρέχει τα ξημερώματα ώρας Ν. Υόρκης (Τρ.–Σάβ.), όταν το Yahoo έχει ολοκληρώσει τις τιμές της μέρας:
# αμέσως μετά το κλείσιμο η τελευταία μέρα έρχεται συχνά μισή για τις περισσότερες μετοχές.
# Σάββατο και Κυριακή: «βαθιά εκπαίδευση» — ξανά εκπαίδευση όλων των μοντέλων και πολύ περισσότερες δοκιμές
# στην αυτόματη αναζήτηση (το μοντέλο εκπαιδεύεται μόνο του· αλλάζει μόνο αν βρεθεί κάτι αποδεδειγμένα καλύτερο).
# Τα δεδομένα (10 χρόνια τιμές, SEC, μοντέλα) μένουν στο cache για την επόμενη φορά.
name: Καθημερινή ανάλυση αγοράς

on:
  schedule:
    - cron: "47 6 * * 2-6"
    - cron: "13 11 * * 6"
    - cron: "29 8 * * 0"
  workflow_dispatch:
    inputs:
      deep:
        description: "Βαθιά εκπαίδευση (πολλές περισσότερες δοκιμές μοντέλων)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["engine.tgz", ".github/workflows/**", "*.html", "*.js", "*.css", "manifest.webmanifest"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Εγκατάσταση μηχανής ανάλυσης
        run: |
          mkdir -p eng && tar -xzf engine.tgz -C eng
          pip install --disable-pip-version-check -q -r eng/requirements-ci.txt

      - name: Δεδομένα από την προηγούμενη μέρα
        uses: actions/cache/restore@v4
        with:
          path: eng/data
          key: usalpha-data-v1-${{ github.run_id }}
          restore-keys: usalpha-data-v1-

      - name: Βαθιά εκπαίδευση (Σαββατοκύριακο)
        if: github.event.schedule == '13 11 * * 6' || github.event.schedule == '29 8 * * 0' || inputs.deep == true
        run: |
          echo "ML_RETRAIN_DAYS=0.01" >> "$GITHUB_ENV"
          echo "ML4_AUTO_TRIES=6" >> "$GITHUB_ENV"
          echo "ML4_AUTO_MAX_TRIES=24" >> "$GITHUB_ENV"
          echo "ML4_AUTO_BUDGET_MIN=200" >> "$GITHUB_ENV"
          echo "ML4_AUTO_CFG_SEC=900" >> "$GITHUB_ENV"
          echo "Βαθιά εκπαίδευση: όλα τα μοντέλα από την αρχή + έως 24 νέοι συνδυασμοί ανά ορίζοντα"

      - name: Ανάλυση όλης της αγοράς
        working-directory: eng
        timeout-minutes: 330
        env:
          USALPHA_NO_SCHEDULER: "1"
          HISTORY_YEARS: "10"
          ML_MAX_TICKERS: "3000"
          DEEP_N: "150"
          SEC_USER_AGENT: "USAlphaMobile research stefanosd2011@users.noreply.github.com"
          PYTHONUNBUFFERED: "1"
          PYTHONWARNINGS: "ignore"
          ML4_TARGET_ROWS: "1600000"
          # τιμές: μόνο ολοκληρωμένες συνεδριάσεις, και όσες μετοχές έμειναν πίσω ξανακατεβαίνουν
          USALPHA_DROP_PARTIAL: "1"
          USALPHA_FRESH_REPAIR: "1"
          # κρυφό κλειδί AI (Settings → Secrets → Actions). Δεν εμφανίζεται ποτέ σε logs ή στη σελίδα.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_PROVIDER: "gemini"
          AI_MAX_CALLS_PER_MIN: "8"
          AI_MONTHLY_BUDGET_USD: "50"
        run: python tools/export_mobile.py --out "$GITHUB_WORKSPACE/_site/data" --budget-min 320

      - name: Αποθήκευση δεδομένων για αύριο
        if: always()
        uses: actions/cache/save@v4
        with:
          path: eng/data
          key: usalpha-data-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Συναρμολόγηση εφαρμογής
        run: |
          cp index.html app.css *.js manifest.webmanifest *.png _site/
          touch _site/.nojekyll
          du -sh _site; ls _site/data | head

      - name: Αναφορά μοντέλων στο repository (ιστορικό αποτελεσμάτων)
        if: always()
        run: |
          if [ -f _site/data/model_report.json ]; then
            mkdir -p reports && cp _site/data/model_report.json reports/model.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add reports/model.json
            if ! git diff --cached --quiet; then
              git commit -q -m "Αναφορά μοντέλων [skip ci]" && (git pull -q --rebase && git push -q) || echo "η αναφορά δεν ανέβηκε"
            fi
          fi

      - name: Η σελίδα κρατιέται για τις ενημερώσεις τιμών μέσα στη μέρα
        uses: actions/cache/save@v4
        with:
          path: _site
          key: usalpha-site-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Το χρονοδιάγραμμα μένει ενεργό
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $((50*86400)) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive [skip ci]" && git push
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
